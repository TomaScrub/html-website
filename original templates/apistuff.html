<img src="https://cataas.com/cat/says/get%20back%20to%20web%20deving?position=center&width=600&height=600&blur=0&font=Impact&fontSize=50&fontColor=%23fff&fontBackground=none" alt="Cat saying good job">

<button id="newcat">New Cat</button>
<img id="catGif" alt="Random cat">

<script>
    const catImg = document.getElementById("catGif");
    const btn = document.getElementById("newcat");
    let currentObjectUrl = null;

    async function loadCat() {
        btn.disabled = true;
        try {
            const resp = await fetch(`https://cataas.com/cat/gif?${Date.now()}`, { cache: 'no-store' });
            if (!resp.ok) throw new Error('Network response was not ok');
            const blob = await resp.blob();
            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = URL.createObjectURL(blob);
            catImg.src = currentObjectUrl;
        } catch (err) {
            console.error('Failed to load cat:', err);
        } finally {
            btn.disabled = false;
        }
    }

    btn.addEventListener('click', loadCat);
    loadCat();
</script>
